_format_version: "3.0"
_transform: true

services:
  - name: userapi
    url: http://userapi:8080
    routes:
      - name: userapi-users
        paths:
          - /users
        strip_path: false
      - name: userapi-auth
        paths:
          - /auth
        strip_path: false
      - name: userapi-jwks
        paths:
          - /.well-known/jwks.json
        strip_path: false

  - name: vehicleapi
    url: http://vehicleapi:8080
    routes:
      - name: vehicleapi-vehicles
        paths:
          - /vehicles
        strip_path: false

  - name: salesapi
    url: http://salesapi:8080
    routes:
      - name: salesapi-sales
        paths:
          - /sales
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      credentials: false
      max_age: 3600
