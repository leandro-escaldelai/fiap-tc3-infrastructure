services:
  # ───────── Bancos de dados ─────────
  mongo-users:
    image: mongo:7
    container_name: mongo-users
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: users
    volumes:
      - mongo-users-data:/data/db
      - ../src/UserApi/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-vehicles:
    image: mongo:7
    container_name: mongo-vehicles
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: vehicles
    volumes:
      - mongo-vehicles-data:/data/db
      - ../src/VehicleApi/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-sales:
    image: postgres:16-alpine
    container_name: postgres-sales
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    volumes:
      - postgres-sales-data:/var/lib/postgresql/data
      - ../src/SalesApi/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ───────── Mensageria ─────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ───────── Microsserviços ─────────
  userapi:
    build:
      context: ../src/UserApi
      dockerfile: Dockerfile
    container_name: userapi
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: "mongodb://mongo-users:27017"
      Mongo__Database: users
      Mongo__Collection: users
      Redis__ConnectionString: "redis:6379"
      Redis__TtlSeconds: "300"
      Jwt__Issuer: UserApi
      Jwt__Audience: tech-challenge
      Jwt__ExpirationMinutes: "120"
      Jwt__PrivateKeyPath: /certs/jwt-private.pem
      Jwt__PublicKeyPath: /certs/jwt-public.pem
      Jwt__KeyId: userapi-key-1
    volumes:
      - ./certs:/certs:ro
    depends_on:
      mongo-users:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  vehicleapi:
    build:
      context: ../src/VehicleApi
      dockerfile: Dockerfile
    container_name: vehicleapi
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: "mongodb://mongo-vehicles:27017"
      Mongo__Database: vehicles
      Mongo__Collection: vehicles
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: "/"
      RabbitMq__VehicleSoldQueue: vehicle.sold
      RabbitMq__VehicleSoldExchange: vehicle.sold.exchange
      Jwt__Issuer: UserApi
      Jwt__Audience: tech-challenge
      Jwt__PublicKeyPath: /certs/jwt-public.pem
      Jwt__KeyId: userapi-key-1
    volumes:
      - ./certs:/certs:ro
    depends_on:
      mongo-vehicles:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      userapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  salesapi:
    build:
      context: ../src/SalesApi
      dockerfile: Dockerfile
    container_name: salesapi
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres-sales;Port=5432;Database=sales;Username=sales;Password=sales"
      VehicleApi__BaseUrl: "http://vehicleapi:8080"
      VehicleApi__TimeoutSeconds: "5"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: "/"
      RabbitMq__VehicleSoldExchange: vehicle.sold.exchange
      Jwt__Issuer: UserApi
      Jwt__Audience: tech-challenge
      Jwt__PublicKeyPath: /certs/jwt-public.pem
      Jwt__KeyId: userapi-key-1
      Database__AutoCreate: "true"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres-sales:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      userapi:
        condition: service_healthy
      vehicleapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ───────── API Gateway ─────────
  kong:
    image: kong:3.7
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_DNS_RESOLVER: "127.0.0.11"
      KONG_DNS_ORDER: "LAST,A,CNAME"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong:/kong:ro
    depends_on:
      userapi:
        condition: service_healthy
      vehicleapi:
        condition: service_healthy
      salesapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-users-data:
  mongo-vehicles-data:
  postgres-sales-data:
